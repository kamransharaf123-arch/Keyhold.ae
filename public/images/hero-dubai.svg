<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100">
<defs>
  <linearGradient id="sky" x1="0.1" y1="0" x2="0.65" y2="1">
    <stop offset="0" stop-color="#1b2523"/>
    <stop offset="0.48" stop-color="#35645f"/>
    <stop offset="0.78" stop-color="#7f9275"/>
    <stop offset="1" stop-color="#e8d9b8"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fbf3df" stop-opacity=".9"/>
    <stop offset="1" stop-color="#fbf3df" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2d3a37"/>
    <stop offset="1" stop-color="#161f1d"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f1614" stop-opacity=".05"/>
    <stop offset="1" stop-color="#0f1614" stop-opacity=".55"/>
  </linearGradient>
  <filter id="soft1"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft2"><feGaussianBlur stdDeviation="34"/></filter>
</defs>

<rect width="1800" height="1100" fill="url(#sky)"/>
<circle cx="1510" cy="300" r="220" fill="url(#sun)" filter="url(#soft2)"/>
<ellipse cx="1180" cy="560" rx="640" ry="70" fill="#e8d9b8" opacity=".08" filter="url(#soft2)"/>

<!-- far haze skyline -->
<g fill="#4c716b" opacity=".32" filter="url(#soft1)">
  <rect x="700" y="600" width="90" height="330"/>
  <rect x="810" y="650" width="120" height="280"/>
  <rect x="945" y="560" width="80" height="370"/>
  <rect x="1580" y="620" width="100" height="310"/>
  <rect x="1690" y="670" width="110" height="260"/>
</g>

<!-- near skyline cluster -->
<g fill="url(#tower)">
  <rect x="985" y="330" width="130" height="660" rx="4"/>
  <rect x="1010" y="245" width="80" height="90" rx="3"/>
  <rect x="1150" y="455" width="105" height="535" rx="4"/>
  <!-- focal tapered spire -->
  <rect x="1300" y="410" width="150" height="580" rx="4"/>
  <rect x="1325" y="285" width="100" height="130" rx="3"/>
  <rect x="1350" y="195" width="50" height="95" rx="2"/>
  <rect x="1371" y="120" width="8" height="80"/>
  <rect x="1495" y="505" width="120" height="485" rx="4"/>
  <rect x="1655" y="580" width="85" height="410" rx="3"/>
</g>

<!-- mullion hairlines -->
<g stroke="#e8d9b8" stroke-opacity=".22" stroke-width="2">
  <path d="M1010 370h90M1010 430h90M1010 490h90M1010 550h90M1010 610h90M1010 670h90M1010 730h90M1010 790h90M1010 850h90"/>
  <path d="M1170 495h65M1170 555h65M1170 615h65M1170 675h65M1170 735h65M1170 795h65M1170 855h65"/>
  <path d="M1320 450h110M1320 510h110M1320 570h110M1320 630h110M1320 690h110M1320 750h110M1320 810h110M1320 870h110"/>
  <path d="M1515 545h80M1515 605h80M1515 665h80M1515 725h80M1515 785h80M1515 845h80M1515 905h80"/>
  <path d="M1673 615h50M1673 670h50M1673 725h50M1673 780h50M1673 835h50M1673 890h50M1673 945h50"/>
</g>

<!-- waterline + reflection -->
<path d="M900 940 C 1150 900, 1420 970, 1800 915 L1800 1100 L900 1100Z" fill="#101917" opacity=".5"/>
<g fill="#e8d9b8" opacity=".14">
  <rect x="1000" y="965" width="120" height="5"/>
  <rect x="1160" y="990" width="90" height="4"/>
  <rect x="1330" y="1015" width="140" height="5"/>
  <rect x="1520" y="1000" width="100" height="4"/>
  <rect x="1000" y="1040" width="200" height="4"/>
  <rect x="1330" y="1060" width="160" height="4"/>
</g>
<rect x="0" y="900" width="1800" height="200" fill="url(#water)"/>

<!-- foreground silhouette wave -->
<path d="M0 830 C 300 760, 620 850, 910 790 S 1480 740, 1800 800 L1800 1100 L0 1100Z" fill="#101917" opacity=".4"/>
</svg>
