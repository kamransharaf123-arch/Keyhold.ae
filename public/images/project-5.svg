<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250">
<defs>
  <linearGradient id="sky" x1="0.15" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#2a2620"/>
    <stop offset="0.55" stop-color="#b99a68"/>
    <stop offset="1" stop-color="#f2ebdd"/>
  </linearGradient>
  <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#33302a"/>
    <stop offset="1" stop-color="#1c1a16"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff3dc" stop-opacity=".9"/>
    <stop offset="1" stop-color="#fff3dc" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1000" height="1250" fill="url(#sky)"/>
<circle cx="500" cy="380" r="190" fill="url(#sun)" filter="url(#soft)"/>

<!-- low, wide villa massing: no towers -->
<g fill="url(#villa)">
  <rect x="140" y="760" width="330" height="200" rx="6"/>
  <rect x="150" y="700" width="150" height="60" rx="4"/>
  <rect x="520" y="800" width="360" height="160" rx="6"/>
  <rect x="700" y="740" width="140" height="60" rx="4"/>
</g>
<g fill="#f4e9d2" opacity=".3">
  <rect x="180" y="800" width="60" height="70"/>
  <rect x="270" y="800" width="60" height="70"/>
  <rect x="360" y="800" width="60" height="70"/>
  <rect x="560" y="840" width="60" height="60"/>
  <rect x="650" y="840" width="60" height="60"/>
  <rect x="740" y="840" width="60" height="60"/>
</g>

<!-- greenery / golf motif -->
<g fill="#65795e" opacity=".5">
  <ellipse cx="620" cy="965" rx="140" ry="20"/>
  <ellipse cx="240" cy="975" rx="120" ry="18"/>
</g>
<g fill="#4b5c3f">
  <ellipse cx="70" cy="880" rx="55" ry="80"/>
  <ellipse cx="930" cy="860" rx="60" ry="90"/>
  <ellipse cx="960" cy="920" rx="45" ry="65"/>
</g>

<path d="M0 985 C 260 955, 520 1015, 780 985 S 940 965, 1000 975 L1000 1250 L0 1250Z" fill="#171310" opacity=".32"/>
</svg>
