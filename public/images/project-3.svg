<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250">
<defs>
  <linearGradient id="sky" x1="0.1" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#2a2320"/>
    <stop offset="0.5" stop-color="#9b5f49"/>
    <stop offset="1" stop-color="#f5e8e2"/>
  </linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#332621"/>
    <stop offset="1" stop-color="#1a1310"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe9d6" stop-opacity=".85"/>
    <stop offset="1" stop-color="#ffe9d6" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1000" height="1250" fill="url(#sky)"/>
<circle cx="500" cy="290" r="170" fill="url(#sun)" filter="url(#soft)"/>

<g fill="#c78368" opacity=".26" filter="url(#soft)">
  <rect x="80" y="640" width="100" height="250"/>
  <rect x="820" y="600" width="110" height="290"/>
</g>

<!-- focal tapered spire, centered -->
<g fill="url(#tower)">
  <rect x="410" y="480" width="180" height="480" rx="4"/>
  <rect x="440" y="340" width="120" height="150" rx="3"/>
  <rect x="465" y="230" width="70" height="120" rx="2"/>
  <rect x="488" y="150" width="24" height="90" rx="1"/>
  <rect x="497" y="105" width="6" height="55"/>
  <rect x="230" y="600" width="130" height="360" rx="3"/>
  <rect x="630" y="640" width="110" height="320" rx="3"/>
</g>

<g stroke="#fceee5" stroke-opacity=".2" stroke-width="2">
  <path d="M440 520h100M440 575h100M440 630h100M440 685h100M440 740h100M440 795h100M440 850h100M440 905h100"/>
  <path d="M255 630h80M255 685h80M255 740h80M255 795h80M255 850h80M255 905h80"/>
  <path d="M655 670h60M655 720h60M655 770h60M655 820h60M655 870h60M655 920h60"/>
</g>

<path d="M0 980 C 260 940, 520 1010, 780 975 S 940 950, 1000 965 L1000 1250 L0 1250Z" fill="#170f0b" opacity=".35"/>
</svg>
