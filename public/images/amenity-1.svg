<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e4efed"/>
    <stop offset="1" stop-color="#f7f4ee"/>
  </linearGradient>
  <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fa8a2"/>
    <stop offset="0.5" stop-color="#497c78"/>
    <stop offset="1" stop-color="#2f524e"/>
  </linearGradient>
  <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff8e8" stop-opacity=".8"/>
    <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1000" height="1250" fill="url(#sky)"/>

<!-- distant skyline sliver above the pool horizon -->
<g fill="#35645f" opacity=".28">
  <rect x="120" y="470" width="60" height="120"/>
  <rect x="200" y="440" width="45" height="150"/>
  <rect x="760" y="460" width="55" height="130"/>
  <rect x="840" y="430" width="40" height="160"/>
</g>

<rect x="0" y="590" width="1000" height="440" fill="url(#pool)"/>
<circle cx="700" cy="640" r="160" fill="url(#glint)" filter="url(#soft)"/>
<g stroke="#eaf6f2" stroke-opacity=".28" stroke-width="4">
  <path d="M60 700h260M420 730h300M120 780h240M480 810h360M60 860h300M480 900h260"/>
</g>

<!-- pool edge -->
<rect x="0" y="580" width="1000" height="16" fill="#eee8de"/>

<!-- loungers -->
<g fill="#2a231b" opacity=".55">
  <rect x="120" y="1030" width="200" height="26" rx="10"/>
  <rect x="150" y="990" width="140" height="46" rx="14"/>
  <rect x="620" y="1060" width="200" height="26" rx="10"/>
  <rect x="650" y="1020" width="140" height="46" rx="14"/>
</g>

<!-- palm accent -->
<g fill="#65795e" opacity=".7">
  <path d="M900 1100 L900 900" stroke="#65795e" stroke-width="10" stroke-linecap="round"/>
  <path d="M900 920 C 860 880, 840 850, 860 810 C 895 850, 905 885, 900 920Z"/>
  <path d="M900 920 C 940 880, 960 850, 940 810 C 905 850, 895 885, 900 920Z"/>
</g>

<rect x="0" y="1030" width="1000" height="220" fill="#eee8de"/>
</svg>
